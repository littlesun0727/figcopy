# 定义 collage 包的构建、运行依赖、CLI 入口与 pytest 默认配置。
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "figcopy-collage"
version = "0.1.0"
description = "Deterministic collage template builder and local PNG renderer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
birefnet = [
    "einops>=0.8,<1",
    "kornia>=0.7,<1",
    "numpy>=1.26,<3",
    "safetensors>=0.4,<1",
    "timm>=1.0.23,<2",
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
    "transformers>=4.46,<6",
]

[project.scripts]
collage = "collage.cli:main"

[tool.setuptools.packages.find]
include = ["collage*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
