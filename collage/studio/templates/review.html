<!doctype html>
<!-- 本页用最少输入确认 Draft 的槽位和白=删除 mask；高级参数默认自动处理。 -->
<meta charset="utf-8">
<meta name="review-api-base" content="__REVIEW_API_BASE__">
<meta name="review-return-url" content="__REVIEW_RETURN_URL__">
<meta name="review-read-only" content="__REVIEW_READ_ONLY__">
<meta name="figcopy-csrf-token" content="__FIGCOPY_CSRF_TOKEN__">
<title>Collage Draft Review</title>
<link rel="stylesheet" href="/static/review.css">
<main>
  <div class="stage review-stage">
    <section><p>参考图与位置编辑</p><div class="canvas-wrap"><canvas id="view"></canvas></div></section>
    <section><p>当前结构预览</p><img id="structurePreview" alt="照片与附属装饰的遮挡预览">
      <p id="structureHint" class="muted">编号色块代表待上传照片；粉色块代表待生成装饰。</p></section>
  </div>
  <aside>
    <a id="returnLink" class="return-link" hidden>← 返回项目</a>
    <h1>确认模板</h1>
    <p class="muted">接受当前识别结果时，无需填写反馈，勾选整体确认即可制作。有修改意见时先提交 VLM 纠正。每个装饰会独立制作。</p>
    <h2>识别复核</h2>
    <section>
      <h2>背景来源</h2>
      <label class="stack">画布最底层由什么提供？
        <select id="backgroundSource">
          <option value="fixed">固定底板：保留或清版</option>
          <option value="slot">客户照片铺满背景</option>
        </select>
      </label>
      <label id="backgroundSlotControl" class="stack" hidden>背景照片槽
        <select id="backgroundSlot"></select>
      </label>
      <p id="backgroundSourceHint" class="auto"></p>
    </section>
    <div id="savedCorrections" hidden></div>
    <div id="questions"></div>
    <label class="stack">其他错误或补充说明（选填）
      <textarea id="otherFeedback" maxlength="12000" placeholder="例如：少识别了一张照片；右上角装饰需要拆开"></textarea>
    </label>
    <button id="revise" class="primary">提交回答，让 VLM 纠正</button>
    <p id="revisionHint" class="muted"></p>
    <div class="row mode">
      <button id="boxMode" class="active">拖动框</button>
      <button id="drawMode">画删除区</button>
      <button id="eraseMode">擦除</button>
      <button id="resetMask">恢复自动涂层</button>
      <label id="brushControl">笔刷 <input id="brush" type="range" min="2" max="160" value="36"></label>
    </div>
    <div id="items"></div>

    <p id="photoBackgroundHint" class="auto" hidden>背景由客户上传的全屏照片提供，无需清版；背景照片需不透明并铺满画布。</p>
    <section id="backgroundControls">
    <h2>清除旧内容</h2>
    <p id="maskHint" class="auto">正在自动标出需要清除的区域…</p>
    <label id="emptyMaskOption" class="warning" hidden>
      <input id="emptyMaskApproved" type="checkbox">
      这张图不需要清除旧内容
    </label>

    <label class="stack">背景制作方式
      <select id="backgroundComposition">
        <option value="protected">局部保护：只替换删除区</option>
        <option value="full_candidate">整张重建：使用完整清版背景</option>
      </select>
    </label>
    <p class="muted">大面积替换照片、纸纹只需近似时可用整张重建，避免新底纹与原图碎片产生接缝；需保留原背景细节时用局部保护。</p>
    <details class="advanced">
      <summary>高级：清版参数</summary>
      <label class="stack">背景补全要求
        <textarea id="backgroundBrief"></textarea>
      </label>
      <div class="row">
        <label>删除区扩张 <input id="backgroundExpand" type="number" min="0" max="4096"></label>
        <label>融合羽化 <input id="backgroundFeather" type="number" min="0" max="4096"></label>
      </div>
    </details>
    </section>
    <details class="advanced">
      <summary>高级：调整图层顺序</summary>
      <div id="layers"></div>
    </details>
    <p id="autoSummary" class="muted"></p>
    <h2>保存</h2>
    <label class="stack"><span><input id="finalConfirmed" type="checkbox">我已检查并接受当前识别结果，未展开的装饰文字沿用识别内容</span></label>
    <div class="row"><button id="save" class="primary">确认并开始制作</button></div>
    <div id="status" class="status">正在载入…</div>
  </aside>
</main>
<script src="/static/review.js"></script>
